    <style>
      /* Pantalla Splash inicial coherente con la paleta Travertino (#F7F3EC) y Terracota (#B5532F) */
      #initial-splash {
        position: fixed;
        inset: 0;
        background-color: #F7F3EC;
        color: #2B2420;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .dark #initial-splash {
        background-color: #181412;
        color: #F5F0E8;
      }
    </style>

        <div style="font-family: Georgia, serif; font-size: 22px; font-weight: 700; letter-spacing: 0.08em;">ROMA</div>
        <div style="font-family: sans-serif; font-size: 12px; color: #685B52; margin-top: 4px; letter-spacing: 0.14em;">VI – VIII NOVIEMBRE</div>
